[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miaa-oct-simulator"
version = "0.1.0"
description = "Synthetic OCT wedge simulator with IAA and MIAA reconstruction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "tqdm>=4.65",
]

[tool.setuptools.packages.find]
where = ["src"]
